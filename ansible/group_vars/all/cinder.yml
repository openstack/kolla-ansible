---
enable_cinder: false
enable_cinder_backup: true
enable_cinder_backend_iscsi: "{{ enable_cinder_backend_lvm | bool }}"
enable_cinder_backend_lvm: false
enable_cinder_backend_nfs: false
enable_cinder_backend_quobyte: false
enable_cinder_backend_pure_iscsi: false
enable_cinder_backend_pure_fc: false
enable_cinder_backend_pure_roce: false
enable_cinder_backend_pure_nvme_tcp: false
enable_cinder_backend_lightbits: false
enable_cinder_backend_vast: false

#################################
# Cinder backends
#################################
# NOTE: These are defined here (rather than in the cinder role defaults) so that
# they are in scope for other roles - notably iscsi, whose play runs before the
# cinder play and derives the cinder-volume/backup inventory groups from
# cinder_enabled_backends.
cinder_backend_ceph_name: "rbd-1"
cinder_backend_lvm_name: "lvm-1"
cinder_backend_nfs_name: "nfs-1"
cinder_backend_quobyte_name: "QuobyteHD"
cinder_backend_pure_iscsi_name: "Pure-FlashArray-iscsi"
cinder_backend_pure_fc_name: "Pure-FlashArray-fc"
cinder_backend_pure_roce_name: "Pure-FlashArray-roce"
cinder_backend_pure_nvme_tcp_name: "Pure-FlashArray-nvme-tcp"
cinder_backend_lightbits_name: "Lightbits-NVMe-TCP"
cinder_backend_vast_name: "vast-nvme-tcp"

cinder_backends:
  - name: "{{ cinder_backend_lvm_name }}"
    enabled: "{{ enable_cinder_backend_lvm | bool }}"
  - name: "{{ cinder_backend_nfs_name }}"
    enabled: "{{ enable_cinder_backend_nfs | bool }}"
  - name: "{{ cinder_backend_quobyte_name }}"
    enabled: "{{ enable_cinder_backend_quobyte | bool }}"
  - name: "{{ cinder_backend_pure_iscsi_name }}"
    enabled: "{{ enable_cinder_backend_pure_iscsi | bool }}"
  - name: "{{ cinder_backend_pure_fc_name }}"
    enabled: "{{ enable_cinder_backend_pure_fc | bool }}"
  - name: "{{ cinder_backend_pure_roce_name }}"
    enabled: "{{ enable_cinder_backend_pure_roce | bool }}"
  - name: "{{ cinder_backend_pure_nvme_tcp_name }}"
    enabled: "{{ enable_cinder_backend_pure_nvme_tcp | bool }}"
  - name: "{{ cinder_backend_lightbits_name }}"
    enabled: "{{ enable_cinder_backend_lightbits | bool }}"
  - name: "{{ cinder_backend_vast_name }}"
    enabled: "{{ enable_cinder_backend_vast | bool }}"

cinder_ceph_backends:
  - name: "{{ cinder_backend_ceph_name }}"
    backend_name: "{{ cinder_backend_ceph_name }}"
    cluster: "{{ ceph_cluster }}"
    user: "{{ ceph_cinder_user }}"
    pool: "{{ ceph_cinder_pool_name }}"
    enabled: "{{ cinder_backend_ceph | bool }}"

cinder_backup_backend_ceph_name: "rbd-1"
cinder_backup_ceph_backend: >-
  {{
    cinder_ceph_backends |
    selectattr('name', 'equalto', cinder_backup_backend_ceph_name) | list | first |
    combine({'pool': ceph_cinder_backup_pool_name, 'user': ceph_cinder_backup_user})
  }}

cinder_enabled_backends: >-
  {{
    cinder_backends | selectattr('enabled', 'equalto', true) | list
    + cinder_ceph_backends | selectattr('enabled', 'equalto', true) | list
  }}

#################################
# Cinder options
#################################
cinder_backend_ceph: false
cinder_backend_huawei: false
cinder_backend_huawei_xml_files: []
cinder_volume_group: "cinder-volumes"
cinder_target_helper: "{{ 'lioadm' if ansible_facts.os_family == 'RedHat' else 'tgtadm' }}"
# Valid options are [ '', valkey, etcd ]
cinder_coordination_backend: "{{ 'valkey' if enable_valkey | bool else 'etcd' if enable_etcd | bool else '' }}"

# Valid options are [ nfs, ceph, s3 ]
cinder_backup_driver: "ceph"
cinder_backup_share: ""
cinder_backup_mount_options_nfs: ""

storage_address_family: "{{ network_address_family }}"

cinder_keystone_user: "cinder"

cinder_internal_fqdn: "{{ kolla_internal_fqdn }}"
cinder_external_fqdn: "{{ kolla_external_fqdn }}"
cinder_internal_base_endpoint: "{{ cinder_internal_fqdn | kolla_url(internal_protocol, cinder_api_port) }}"
cinder_public_base_endpoint: "{{ cinder_external_fqdn | kolla_url(public_protocol, cinder_api_public_port) }}"
cinder_api_port: "8776"
cinder_api_public_port: "{{ haproxy_single_external_frontend_public_port if haproxy_single_external_frontend | bool else cinder_api_port }}"
cinder_api_listen_port: "{{ cinder_api_port }}"
