---
# TODO: Remove this block in 2027.2
- name: Clean up obsolete neutron OVN metadata agent
  become: true
  when: neutron_plugin_agent == 'ovn'
  block:
    - name: Remove obsolete neutron OVN metadata agent container
      kolla_container:
        action: "stop_and_remove_container"
        common_options: "{{ docker_common_options }}"
        name: "neutron_ovn_metadata_agent"
        ignore_missing: true

    - name: Get container names for obsolete OVN metadata HAProxy cleanup
      kolla_container_facts:
        action: get_containers_names
        container_engine: "{{ kolla_container_engine }}"
      register: ovn_metadata_haproxy_containers

    - name: Remove obsolete neutron OVN metadata agent HAProxy containers
      kolla_container:
        action: "stop_and_remove_container"
        common_options: "{{ docker_common_options }}"
        name: "{{ item }}"
        ignore_missing: true
      loop: >-
        {{ ovn_metadata_haproxy_containers.container_names | default([])
           | select('match', '^neutron_ovn_metadata_agent_haproxy_') | list }}

    - name: Remove obsolete neutron OVN metadata agent configuration
      ansible.builtin.file:
        path: "{{ node_config_directory }}/neutron-ovn-metadata-agent"
        state: absent

- name: Import tasks from config-host.yml
  ansible.builtin.import_tasks: config-host.yml

- name: Import tasks from config.yml
  ansible.builtin.import_tasks: config.yml

- name: Import tasks from check-containers.yml
  ansible.builtin.import_tasks: check-containers.yml

- name: Include tasks from config-neutron-fake.yml
  ansible.builtin.include_tasks: config-neutron-fake.yml
  when:
    - inventory_hostname in groups['compute']
    - enable_nova_fake | bool

- name: Running Neutron database expand container
  vars:
    neutron_server: "{{ neutron_services['neutron-server'] }}"
  become: true
  kolla_container:
    action: "start_container"
    common_options: "{{ docker_common_options }}"
    detach: false
    environment:
      KOLLA_UPGRADE:
      NEUTRON_DB_EXPAND:
      KOLLA_CONFIG_STRATEGY: "{{ config_strategy }}"
      NEUTRON_ROLLING_UPGRADE_SERVICES: "{{ neutron_rolling_upgrade_services | join(' ') }}"
    image: "{{ neutron_server.image }}"
    labels:
      UPGRADE:
    name: "bootstrap_neutron"
    restart_policy: oneshot
    volumes: "{{ neutron_server.volumes }}"
  run_once: true
  delegate_to: "{{ groups['neutron-server'][0] }}"

- name: Flush Handlers
  ansible.builtin.meta: flush_handlers

- name: Checking neutron pending contract scripts
  become: true
  changed_when: false
  ansible.builtin.command: "{{ kolla_container_engine }} exec -t neutron_server neutron-db-manage --subproject {{ item }} has_offline_migrations"
  register: neutron_check_contract_db_stdout
  ignore_errors: true
  with_items: "{{ neutron_rolling_upgrade_services }}"
  when: inventory_hostname == groups['neutron-server'][0]

- name: Stopping all neutron-server for contract db
  vars:
    service: "{{ neutron_services['neutron-server'] }}"
    first_neutron_server_host: "{{ groups[service.group][0] }}"
    results_of_check_pending_contract_scripts: "{{ hostvars[first_neutron_server_host]['neutron_check_contract_db_stdout'] }}"
    # NOTE(hrw): no idea
    filter_rc: "results[?rc!=`0`]"
    is_stop_neutron_server: "{{ results_of_check_pending_contract_scripts | json_query(filter_rc) }}"
  become: true
  kolla_container:
    action: "stop_container"
    common_options: "{{ docker_common_options }}"
    name: "{{ service.container_name }}"
  when:
    - service.host_in_groups | bool
    - is_stop_neutron_server | length > 0
  notify:
    - "Restart neutron-server container"

- name: Running Neutron database contract container
  vars:
    neutron_server: "{{ neutron_services['neutron-server'] }}"
  become: true
  kolla_container:
    action: "start_container"
    common_options: "{{ docker_common_options }}"
    detach: false
    environment:
      KOLLA_UPGRADE:
      NEUTRON_DB_CONTRACT:
      KOLLA_CONFIG_STRATEGY: "{{ config_strategy }}"
      NEUTRON_ROLLING_UPGRADE_SERVICES: "{{ neutron_rolling_upgrade_services | join(' ') }}"
    image: "{{ neutron_server.image }}"
    labels:
      UPGRADE:
    name: "bootstrap_neutron"
    restart_policy: oneshot
    volumes: "{{ neutron_server.volumes }}"
  run_once: true
  delegate_to: "{{ groups['neutron-server'][0] }}"

# Flush handlers here to ensure neutron-server containers are started
- name: Flush Handlers
  ansible.builtin.meta: flush_handlers
