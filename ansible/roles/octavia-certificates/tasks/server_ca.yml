---
- name: Creating server_ca private key
  community.crypto.openssl_privatekey:
    path: "{{ octavia_certs_work_dir }}/server_ca/server_ca.key.pem"
    mode: "0600"
    size: 4096
    type: RSA
    cipher: auto
    passphrase: "{{ octavia_ca_password }}"
    regenerate: never

- name: Creating server_ca certificate signing request (CSR)
  vars:
    server_ca_subject:
      C: "{{ octavia_certs_server_ca_country }}"
      ST: "{{ octavia_certs_server_ca_state }}"
      O: "{{ octavia_certs_server_ca_organization }}"
      OU: "{{ octavia_certs_server_ca_organizational_unit }}"
      CN: "{{ octavia_certs_server_ca_common_name }}"
  community.crypto.openssl_csr:
    path: "{{ octavia_certs_work_dir }}/server_ca/server_ca.csr.pem"
    privatekey_path: "{{ octavia_certs_work_dir }}/server_ca/server_ca.key.pem"
    privatekey_passphrase: "{{ octavia_ca_password }}"
    basic_constraints:
      - 'CA:TRUE'
    basic_constraints_critical: true
    key_usage:
      - digitalSignature
      - keyCertSign
    key_usage_critical: true
    use_common_name_for_san: false
    country_name: "{{ server_ca_subject.C }}"
    state_or_province_name: "{{ server_ca_subject.ST }}"
    organization_name: "{{ server_ca_subject.O }}"
    organizational_unit_name: "{{ server_ca_subject.OU }}"
    common_name: "{{ server_ca_subject.CN }}"

- name: Create self-signed server_ca certificate from CSR
  community.crypto.x509_certificate:
    path: "{{ octavia_certs_work_dir }}/server_ca/server_ca.cert.pem"
    csr_path: "{{ octavia_certs_work_dir }}/server_ca/server_ca.csr.pem"
    privatekey_path: "{{ octavia_certs_work_dir }}/server_ca/server_ca.key.pem"
    privatekey_passphrase: "{{ octavia_ca_password }}"
    provider: selfsigned
    selfsigned_digest: sha256
    selfsigned_not_after: "+{{ octavia_certs_server_ca_expiry }}d"
