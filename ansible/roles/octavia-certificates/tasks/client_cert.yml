---
# NOTE(yoctozepto): This should ideally be per controller, i.e. controller
# generates its key&CSR and this CA signs it.

- name: Creating client certificate key
  community.crypto.openssl_privatekey:
    path: "{{ octavia_certs_work_dir }}/client_ca/client.key.pem"
    mode: "0600"
    size: 4096
    type: RSA

- name: Creating client certificate signing request (CSR)
  vars:
    client_req_subject:
      C: "{{ octavia_certs_client_req_country }}"
      ST: "{{ octavia_certs_client_req_state }}"
      O: "{{ octavia_certs_client_req_organization }}"
      OU: "{{ octavia_certs_client_req_organizational_unit }}"
      CN: "{{ octavia_certs_client_req_common_name }}"
  community.crypto.openssl_csr:
    path: "{{ octavia_certs_work_dir }}/client_ca/client.csr.pem"
    privatekey_path: "{{ octavia_certs_work_dir }}/client_ca/client.key.pem"
    use_common_name_for_san: false
    basic_constraints:
      - 'CA:FALSE'
    basic_constraints_critical: true
    key_usage:
      - digitalSignature
    key_usage_critical: true
    extended_key_usage:
      - clientAuth
    country_name: "{{ client_req_subject.C }}"
    state_or_province_name: "{{ client_req_subject.ST }}"
    organization_name: "{{ client_req_subject.O }}"
    organizational_unit_name: "{{ client_req_subject.OU }}"
    common_name: "{{ client_req_subject.CN }}"

- name: Sign the client certificate request
  community.crypto.x509_certificate:
    path: "{{ octavia_certs_work_dir }}/client_ca/client.cert.pem"
    csr_path: "{{ octavia_certs_work_dir }}/client_ca/client.csr.pem"
    provider: ownca
    ownca_path: "{{ octavia_certs_work_dir }}/client_ca/client_ca.cert.pem"
    ownca_privatekey_path: "{{ octavia_certs_work_dir }}/client_ca/client_ca.key.pem"
    ownca_privatekey_passphrase: "{{ octavia_client_ca_password }}"
    ownca_digest: sha256
    ownca_not_after: "+{{ octavia_certs_client_expiry }}d"

- name: Create a concatenated client certificate and key file
  ansible.builtin.assemble:
    regexp: ^client\.(cert|key)\.pem$
    src: "{{ octavia_certs_work_dir }}/client_ca"
    dest: "{{ octavia_certs_work_dir }}/client_ca/client.cert-and-key.pem"
    mode: "0660"
