- project-template:
    name: openstack-python3-jobs-kolla-ansible
    # NOTE(mnasiadka): Local definition to skip py311 jobs on Hibiscus
    description: |
      Runs unit tests for an OpenStack Python project under the CPython
      version 3 releases designated for testing the latest release.
    check:
      jobs:
        - openstack-tox-pep8
        - openstack-tox-py312
        - openstack-tox-py313
        - openstack-tox-py314
    gate:
      jobs:
        - openstack-tox-pep8
        - openstack-tox-py312
        - openstack-tox-py313
        - openstack-tox-py314
    post:
      jobs:
        - publish-openstack-python-branch-tarball