---
- job:
    name: kolla-ansible-ovn-base
    parent: kolla-ansible-base
    files: !override
      - ^ansible/group_vars/all/(neutron|ovn).yml
      - ^ansible/roles/(neutron|ovn-controller|ovn-db)/
      - ^tests/scenarios/ovn.yml
      - ^tests/templates/globals-scenario/ovn\.j2
      - ^tests/test-ovn.sh
    voting: false
    vars:
      scenario: ovn
      scenario_images_extra:
        - ^octavia
        - ^ovn
        - ^prometheus

- job:
    name: kolla-ansible-debian-trixie-ovn
    parent: kolla-ansible-ovn-base
    nodeset: kolla-ansible-debian-trixie-multi-8GB

- job:
    name: kolla-ansible-debian-trixie-ovn-upgrade
    parent: kolla-ansible-debian-trixie-ovn
    nodeset: kolla-ansible-debian-trixie-multi-8GB
    timeout: 10800

- job:
    name: kolla-ansible-rocky-10-ovn
    parent: kolla-ansible-ovn-base
    nodeset: kolla-ansible-rocky-10-multi-8GB

- job:
    name: kolla-ansible-rocky-10-ovn-upgrade
    parent: kolla-ansible-rocky-10-ovn
    nodeset: kolla-ansible-rocky-10-multi-8GB
    timeout: 10800

- job:
    name: kolla-ansible-ubuntu-noble-ovn
    parent: kolla-ansible-ovn-base
    nodeset: kolla-ansible-ubuntu-noble-multi-8GB

- job:
    name: kolla-ansible-ubuntu-noble-ovn-upgrade
    parent: kolla-ansible-ubuntu-noble-ovn
    nodeset: kolla-ansible-ubuntu-noble-multi-8GB
    timeout: 10800

- project-template:
    name: kolla-ansible-scenario-ovn
    description: |
      Runs Kolla-Ansible OVN scenario jobs.
    check:
      jobs:
        - kolla-ansible-debian-trixie-ovn
        - kolla-ansible-debian-trixie-ovn-upgrade
        - kolla-ansible-rocky-10-ovn
        - kolla-ansible-rocky-10-ovn-upgrade
        - kolla-ansible-ubuntu-noble-ovn
        - kolla-ansible-ubuntu-noble-ovn-upgrade
