---
fixes:
  - |
    Fixes service-to-service authentication between Cinder and
    Glance. This resolves ``HTTP 403 Forbidden`` errors during
    ``fetch_image_location`` and restores fast volume cloning
    (Copy-on-Write) for backends like RBD, preventing an
    unnecessary fallback to slow image downloads.
    `LP#2161971 <https://launchpad.net/bugs/2161971>`__
