---
features:
  - |
    Added a new variable ``enable_cinder_backend_privileged`` to control
    whether the Glance API container runs in privileged mode and has
    ``/dev`` bind-mounted from the host.

    By default this option is set to ``true`` when
    ``enable_cinder_backend_iscsi``, ``cinder_backend_ceph`` or
    ``enable_cinder_backend_vast`` are enabled, and to ``false`` otherwise.
    Operators can override it manually for other Cinder backends that rely
    on os-brick (e.g., PowerFlex/ScaleIO, FibreChannel).

upgrade:
  - |
    Deployments using Cinder backends other than iSCSI, Ceph or VAST may
    need to explicitly set ``enable_cinder_backend_privileged: true`` in
    ``globals.yml`` to ensure image upload works correctly.
