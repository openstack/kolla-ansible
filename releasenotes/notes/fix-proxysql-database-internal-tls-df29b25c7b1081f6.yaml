---
fixes:
  - |
    Fixes bug `LP#2150449 <https://bugs.launchpad.net/kolla-ansible/+bug/2150449>`__
    where ProxySQL's database internal TLS fails when users use chain of
    certificates (e.g. use of intermediate certificates).

    Users are now required to prepare certificate file named
    ``proxysql-ca.pem`` at ``kolla_certificates_dir`` if ProxySQL and
    database internal TLS are enabled.

    This file can be a copy of root CA of database internal TLS if intermediate
    certificates are not used.
    This file needs to be the intermediate certificate that signed the leaf
    certificate if there a chain of certificates is used.
upgrade:
