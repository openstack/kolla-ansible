---
fixes:
  - |
    Fixes ``designate_backend_bind9`` failing to start on Debian Trixie
    (BIND 9.20), because ``dnssec-validation yes`` requires configured
    trust anchors. On Debian Trixie, ``designate_dnssec_validation`` now
    defaults to ``no``, which matches the previous behaviour on other
    distributions, where no trust anchors were configured and therefore
    no validation took place.
    `LP#2172293 <https://bugs.launchpad.net/kolla-ansible/+bug/2172293>`__
