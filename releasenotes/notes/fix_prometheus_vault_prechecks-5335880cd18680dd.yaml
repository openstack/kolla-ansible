---
fixes:
  - |
    Fixes Prometheus precheck failing on ``prometheus_bcrypt_salt``,
    ``prometheus_password``, ``prometheus_grafana_password`` and
    ``prometheus_skyline_password`` when these are Ansible Vault encrypted
    values, due to a known Ansible limitation where the ``is string`` Jinja
    test does not recognise vault-encrypted strings. See
    `ansible/ansible#33067 <https://github.com/ansible/ansible/issues/33067>`__
    for details.
