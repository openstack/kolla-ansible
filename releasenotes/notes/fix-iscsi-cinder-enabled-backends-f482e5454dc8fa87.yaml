---
fixes:
  - |
    Fixes ``kolla-ansible prechecks`` (and deploy/reconfigure) failing with
    ``'cinder_enabled_backends' is undefined`` in the ``iscsi`` role when a
    Cinder iSCSI/LVM backend is enabled. The ``cinder_enabled_backends`` and
    related backend variables are now defined in ``group_vars/all`` so that
    they are in scope for the ``iscsi`` role, whose play runs before the
    ``cinder`` play. `LP#2158120
    <https://bugs.launchpad.net/kolla-ansible/+bug/2158120>`__
