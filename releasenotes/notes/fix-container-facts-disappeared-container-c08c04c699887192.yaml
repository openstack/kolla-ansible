---
fixes:
  - |
    Fixes ``kolla_container_facts`` failing when a container, which was not
    requested, is removed while gathering container facts (e.g. a
    short-lived container started with ``--rm``, as used by cephadm). Errors
    in the module are now reported correctly instead of failing with
    ``fail_json() got multiple values for keyword argument 'changed'``.
    `LP#2175726 <https://bugs.launchpad.net/kolla-ansible/+bug/2175726>`__
