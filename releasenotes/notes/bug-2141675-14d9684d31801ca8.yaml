---
fixes:
  - |
    Fixed race conditions where tasks involving container facts
    retrieval and ``exec`` commands (e.g. during RabbitMQ restarts and
    configuration validation) could run before the container runtime was
    ready, causing intermittent "container state improper" and
    connection reset errors. A retry mechanism has been added to handle
    this.
    `LP#2141675 <https://launchpad.net/bugs/2141675>`__
