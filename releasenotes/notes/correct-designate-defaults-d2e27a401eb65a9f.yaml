---
upgrade:
  - |
    The default value of ``designate_dnssec_validation`` has changed from
    ``yes`` (``no`` on Debian Trixie) to ``auto``. Previously no trust
    anchors were configured, so BIND did not perform any DNSSEC
    validation. With ``auto``, BIND validates DNSSEC using its built-in
    root trust anchor, which it keeps up to date automatically. This only
    affects deployments that enable ``designate_recursion`` or set
    ``designate_forwarders_addresses``: resolving names in zones with
    broken DNSSEC will now fail. To keep the previous behaviour, set
    ``designate_dnssec_validation: "no"``.
